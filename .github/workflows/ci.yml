name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sidecar:
    name: sidecar (pytest + ruff)
    # macOS runner: the default engine registry is platform-dependent and the
    # suite asserts darwin/arm64 registrations (test_indextts25_mps.py).
    runs-on: macos-latest
    defaults:
      run:
        working-directory: sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: sidecar/uv.lock
      - run: uv sync --dev
      - name: Ruff (includes checked noqa validation via RUF100/BLE)
        run: uv run ruff check .
      - name: Pytest (timeout guard enforced by pytest-timeout)
        run: uv run pytest -q --timeout=60

  frontend:
    name: frontend (eslint + tsc + vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
