[project]
name = "voiceclone-sidecar"
version = "0.1.0"
description = "VoiceClone local inference sidecar: engine registry, generation contract, log streaming"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
    "httpx>=0.27",
    "keyring>=25",
]

[project.scripts]
voiceclone-sidecar = "voiceclone_sidecar.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "websockets>=13",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Guard rail: no single test may hang the suite. Restored in issue #30 —
# a stray .pyc hinted it once existed but was neither declared nor installed.
timeout = 60
timeout_method = "thread"
addopts = "-ra"
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/__snapshots__"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "BLE", # blind except — makes every `# noqa: BLE001` a *checked* suppression
    "RUF", # ruff-specific (unused noqa etc.)
]
ignore = [
    "E501",   # line length is a formatting concern; the codebase predates a formatter
    "RUF001", # ambiguous-unicode in strings: user-facing messages are intentionally Chinese
    "RUF002", # same for docstrings
    "RUF003", # same for comments
]

[tool.ruff.lint.isort]
known-first-party = ["voiceclone_sidecar"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voiceclone_sidecar"]
