[project]
name = "voiceclone-sidecar"
version = "0.1.0"
description = "VoiceClone local inference sidecar: engine registry, generation contract, log streaming"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
]

[project.scripts]
voiceclone-sidecar = "voiceclone_sidecar.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "websockets>=13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voiceclone_sidecar"]
